# Archive: portfolio version 2 (from github.com/mandalaoui/portfolio-v2).
# Create React App: built on Netlify into build/. CI=false so lint warnings
# don't fail the build. Branch deploy URL:
# https://archive-v2--omer-mandalaoui.netlify.app
[build]
  command = "CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
